# nginx.conf
# ─────────────────────────────────────────────────────────────
# NGINX-Konfiguration für React Single Page Application.
#
# Wichtigste Regel: "try_files $uri $uri/ /index.html"
# React Router verwaltet Routen im Browser. Wenn jemand /dashboard
# direkt aufruft, findet NGINX keine Datei "dashboard" — ohne diese
# Regel käme ein 404. Mit der Regel wird immer index.html ausgeliefert
# und React Router übernimmt die Navigation.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;  # Alle Hostnamen akzeptieren
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header
    add_header X-Frame-Options          "DENY"           always;
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header Referrer-Policy          "strict-origin"  always;
    add_header X-XSS-Protection         "1; mode=block"  always;

    # Alle Routen → index.html (für React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets: lang cachen (Vite generiert eindeutige Dateinamen)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;  # Keine Logs für statische Dateien
    }

    # Kein Caching für index.html — Browser soll immer aktuellste Version prüfen
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Komprimierung aktivieren
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
