name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: TypeScript-Kompilierung + Dependency-Audit ──────────
  backend:
    name: Backend Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      # Bekannte Sicherheitslücken in Abhängigkeiten prüfen
      - name: Dependency-Audit
        run: npm audit --audit-level=high

      # TypeScript kompilieren — schlägt fehl bei Typfehlern
      - name: TypeScript Build
        run: npm run build

  # ── Frontend: TypeScript + Vite Build + Dependency-Audit ─────────
  frontend:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      # Sicherheitslücken prüfen
      - name: Dependency-Audit
        run: npm audit --audit-level=high

      # TypeScript + Vite Build — schlägt fehl bei Fehler
      - name: Vite Build
        run: npm run build
